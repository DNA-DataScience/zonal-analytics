name: Build and Deploy Frontend Container

#Deploy 3

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # 1. Log in to Azure
      # -----------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -----------------------
      # 2. Log in to ACR
      # -----------------------
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }} # e.g. mycontainer.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # -----------------------
      # 3. Build and push Docker image
      # -----------------------
      - name: Build and push image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/map-frontend:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/map-frontend:${{ github.sha }}

      # -----------------------
      # 4. Deploy to Azure App Service
      # -----------------------
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/map-frontend:${{ github.sha }}

      # -----------------------
      # 5. Logout (optional)
      # -----------------------
      - name: Logout
        run: az logout
