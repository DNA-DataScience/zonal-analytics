name: Build and deploy Python app to Azure Web App - zonal-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Install UV (Astral)
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # (Optional but recommended) Sync dependencies using uv
      # This installs packages into a uv-managed .venv but also validates lockfile
      - name: Sync dependencies with uv
        run: uv sync

      # Ensure the .venv is included for deployment
      # Azure App Service needs a full runtime, not an editable environment
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp -r . artifact/
          cp -r .venv artifact/
          # remove CI junk
          rm -rf artifact/.git artifact/.github artifact/antenv || true

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: artifact/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zonal-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.__publishingprofilesecretname__ }}
