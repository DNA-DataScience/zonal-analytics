# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - zonal-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: zonalacr.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_53E7586E42F7438F9BDAAA3EC1D48F56 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_CF3C2F5E2D6F4AD9A5C2CA025086E9BC }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: zonalacr.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_53E7586E42F7438F9BDAAA3EC1D48F56 }}/map-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CE20D77076BF4AE7990C155833465E82 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E6E375282843496A8E03A3BBA6BFC2F8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F47C59D4EB6E449283363B03ABC9EFD1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'zonal-backend'
          slot-name: 'Production'
          images: 'zonalacr.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_53E7586E42F7438F9BDAAA3EC1D48F56 }}/map-backend:${{ github.sha }}'
          