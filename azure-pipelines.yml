trigger:
  branches:
    include:
      - master
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  azureServiceConnection: "ServConn-Zonal"
  azureWebAppName: "zonal-backend"
  pythonVersion: "3.13"

steps:
  # 1. Install Python
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(pythonVersion)"
      architecture: "x64"

  # 2. Install uv
  - script: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo "$HOME/.local/bin" >> $GITHUB_PATH
    displayName: "Install uv"

  # 3. Sync dependencies (creates .venv)
  - script: |
      uv sync --no-dev
    displayName: "Install dependencies with uv"

  # 4. Create Azure-compatible startup script
  - script: |
      echo '#!/bin/bash' > startup.sh
      echo 'source .venv/bin/activate' >> startup.sh
      echo 'gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120' >> startup.sh
      chmod +x startup.sh
    displayName: "Create startup.sh"

  # 5. Archive everything
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
      includeRootFolder: false
      archiveFile: "$(Build.ArtifactStagingDirectory)/backend.zip"
      replaceExistingArchive: true

  # 6. Publish artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "$(Build.ArtifactStagingDirectory)"
      ArtifactName: "backend"
      publishLocation: "Container"

  # 7. Deploy to Azure App Service
  - task: AzureWebApp@1
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "webAppLinux"
      appName: "$(azureWebAppName)"
      package: "$(Build.ArtifactStagingDirectory)/backend.zip"
      startUpCommand: "bash startup.sh"
